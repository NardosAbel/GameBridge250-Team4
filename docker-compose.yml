services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: campus_esports_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=campus_esports
      - DB_USERNAME=campus_user
      - DB_PASSWORD=campus_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - BROADCAST_CONNECTION=reverb
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campus_network

  web:
    image: nginx:alpine
    container_name: campus_esports_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - campus_network

  postgres:
    image: postgres:16-alpine
    container_name: campus_esports_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_esports
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_esports"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_network

  redis:
    image: redis:7-alpine
    container_name: campus_esports_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_network

  reverb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: campus_esports_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      - app
      - redis
    networks:
      - campus_network

  horizon:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: campus_esports_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan horizon
    depends_on:
      - app
      - redis
      - postgres
    networks:
      - campus_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: campus_esports_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - campus_network

  frontend:
    image: node:22-alpine
    container_name: campus_esports_frontend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - campus_network

volumes:
  postgres_data:
  redis_data:

networks:
  campus_network:
    driver: bridge
